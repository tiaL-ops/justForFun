<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enchanted Rose</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Enchanted Rose Bell Jar -->
  <div class="bell-jar">
    <div class="flower">
      <div class="stem"></div>
      <div class="leaf leaf-left"></div>
      <div class="leaf leaf-right"></div>
      <div class="petals">
        <div class="petal petal-1"></div>
        <div class="petal petal-2"></div>
        <div class="petal petal-3"></div>
        <div class="petal petal-4"></div>
      </div>
      <div class="falling-petal"></div>
    </div>
  </div>

  <!-- Poem Display -->
  <div class="poem-display">
    <div class="poem-line">
      Roses are red,
    </div>
    <div class="poem-line">
      Violets are blue,
    </div>
    <div class="poem-line">
        In a world of 0's and 1's,
      </div>
      <div class="poem-line">
        I fell for you
      </div>
  </div>
  
</body>
</html>
