<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Minimalist Loading</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Small Character Image -->
  <div class="character-container">
    <img src="us.jpg" alt="Cute Character" class="character-image">
  </div>

  <div class="loading-container">
    <div class="loading-bar"></div>
    <span class="loading-text">Are you a binary search algorithm</span>
    <div class="loading-percentage">0%</div>
   
  </div>
  <div class="final-message">Because you found a way to my heart in a record time! 💖</div>

  <script src="script.js"></script>
</body>
</html>
